services:
  backend-api:
    build:
      context: apps/backend-api
      target: dev
    ports:
      - "8080-8099:8080"
    env_file:
      - path: apps/backend-api/.env
        required: false
    volumes:
      - ./apps/backend-api:/app
      - backend-go-mod-cache:/go/pkg/mod
      - backend-go-build-cache:/root/.cache/go-build

  frontend-app:
    build:
      context: apps/frontend-app
    ports:
      - "4321-4399:4321"
    env_file:
      - path: apps/frontend-app/.env
        required: false
    volumes:
      - ./apps/frontend-app:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend-api

  website:
    build:
      context: apps/website-vexil
    ports:
      - "4322-4399:4321"
    env_file:
      - path: apps/website-vexil/.env
        required: false
    volumes:
      - ./apps/website-vexil:/app
      - website-node-modules:/app/node_modules

volumes:
  backend-go-mod-cache:
  backend-go-build-cache:
  frontend-node-modules:
  website-node-modules:

[project]
name = "env-init"
version = "0.1.3"
description = "Streamlit environment initializer for the VEXiL monorepo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.45.0",
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[project.scripts]
env-init = "env_init.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["env_init"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
